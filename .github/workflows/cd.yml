name: CD - Deploy to Production

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Deploy to Hostinger
    runs-on: ubuntu-latest
    
    environment:
      name: production
      url: https://wazebr.com.br

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, curl, simplexml, json, mysql, pdo_mysql
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('composer.lock') }}

      - name: Check platform requirements (PHP >= 8.5.12 e extensões)
        run: composer check-platform-reqs --lock --no-dev

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-dev --optimize-autoloader

      - name: Check PHP version on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            php -r 'if (version_compare(PHP_VERSION, "8.5.12", "<")) { fwrite(STDERR, "PHP " . PHP_VERSION . " < 8.5.12 no servidor\n"); exit(1); } echo "PHP " . PHP_VERSION . " OK\n";'

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          ftp-server: ${{ secrets.FTP_SERVER }}
          ftp-username: ${{ secrets.FTP_USERNAME }}
          ftp-password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /public_html/
          exclude: |
            .git/**
            .github/**
            tests/**
            node_modules/**
            .env*
            vendor/**
          dry-run: false

      - name: Upload vendor separately
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          ftp-server: ${{ secrets.FTP_SERVER }}
          ftp-username: ${{ secrets.FTP_USERNAME }}
          ftp-password: ${{ secrets.FTP_PASSWORD }}
          local-dir: vendor/
          server-dir: /public_html/vendor/
          dry-run: false

      - name: Run migrations on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/u937753890/domains/wazebr.com.br/public_html
            php bin/console asset-map:compile --env=prod
            php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
            php bin/console cache:clear --env=prod
            php bin/console cache:warmup --env=prod

      - name: Notify success
        if: success()
        run: echo "✅ Deploy completed successfully!"

      - name: Notify failure
        if: failure()
        run: echo "❌ Deploy failed! Check logs for details."