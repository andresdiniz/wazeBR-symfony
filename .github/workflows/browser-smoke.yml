name: Alerts browser smoke (staging)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/trafik-browser"
          cd "$RUNNER_TEMP/trafik-browser"
          npm init -y
          npm install --save-exact playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test staging alerts
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: NODE_PATH="$RUNNER_TEMP/trafik-browser/node_modules" node scripts/browser/alerts-smoke.cjs
