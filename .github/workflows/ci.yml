name: CI - Tests & Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests & Quality (PHP 8.5)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wazebr_test
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, intl, curl, simplexml, json, mysql, pdo_mysql, pdo_sqlite, sqlite3
          tools: composer:v2
          coverage: none

      - name: PHP version
        run: php -v

      - name: Validate composer.json and lock
        run: composer validate --no-check-publish

      - name: Check platform requirements (PHP >= 8.5.12 e extensões)
        run: composer check-platform-reqs --lock

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Lint PHP syntax (PHP 8.5)
        run: |
          find src tests config public -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l > /tmp/php-lint.log 2>&1 \
            || { grep -v '^No syntax errors' /tmp/php-lint.log; exit 1; }

      - name: Run PHPUnit
        run: php bin/phpunit --colors=always

      - name: Run PHPStan
        run: php vendor/bin/phpstan analyse --no-progress --memory-limit=512M
