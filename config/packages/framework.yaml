framework:
    secret: '%env(APP_SECRET)%'
    http_method_override: false
    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
    trusted_proxies: '127.0.0.1,::1'
    trusted_headers: ['x-forwarded-for','x-forwarded-proto','x-forwarded-host','x-forwarded-port','x-forwarded-prefix']

# Headers de seguranca basicos (pode ser ajustado em um listener se quiser mais controle)
# Para complementar, voce pode instalar o nelmio/security-bundle via Composer:
# composer require nelmio/security-bundle
