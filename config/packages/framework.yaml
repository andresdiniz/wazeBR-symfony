# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    #csrf_protection: true
    annotations: false
    http_method_override: false
    handle_all_throwables: true

    # Enables session support
    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
        storage_factory_id: session.storage.factory.native

    #esi: true
    #fragments: true
    php_errors:
        log: true

    # PÃ¡ginas de erro customizadas
    error_controller: framework.controller.error
    exceptions:
        Symfony\Component\HttpKernel\Exception\NotFoundHttpException:
            controller: App\Controller\ErrorController::notFound
        Symfony\Component\HttpKernel\Exception\HttpException:
            controller: App\Controller\ErrorController::error
        Throwable:
            controller: App\Controller\ErrorController::error

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file

when@prod:
    framework:
        # Em produÃ§Ã£o, nÃ£o mostrar detalhes de erro no browser
        exceptions:
            Symfony\Component\HttpKernel\Exception\NotFoundHttpException:
                controller: App\Controller\ErrorController::notFound
            Throwable:
                controller: App\Controller\ErrorController::error
