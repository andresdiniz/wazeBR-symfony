# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%%'
    #csrf_protection: true
    annotations: false
    http_method_override: false
    handle_all_throwables: true

    # Enables session support
    session:
        handler_id: null
        cookie_secure: auto
        cookie_samesite: lax
        storage_factory_id: session.storage.factory.native

    #esi: true
    #fragments: true
    php_errors:
        log: true

    default_locale: pt_BR

    scheduler: true

    http_cache:
        enabled: true

    rate_limiter:
        reverse_geocode:
            policy: sliding_window
            limit: 30
            rate:
                interval: '1 minute'
                amount: 30

        password_reset:
            policy: fixed_window
            limit: 5
            interval: '1 hour'

        traffic_control:
            policy: token_bucket
            limit: 10
            rate:
                interval: '1 minute'
                amount: 10

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file

when@prod:
    framework:
        php_errors:
            log: true
