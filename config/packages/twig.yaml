twig:
    file_name_pattern: '*.html.twig'
    default_path: '%kernel.project_dir%/templates'
    date:
        # Todas as datas do banco (createdAt, collectedAt, pubDate, etc.) são
        # armazenadas/hidratadas em UTC (timezone padrão do PHP no servidor,
        # que não define date.timezone). Sem isso, o filtro |date() exibia
        # tudo 3h à frente do horário de Brasília (e virava o dia perto da
        # meia-noite). Isso NÃO altera como as datas são armazenadas ou
        # comparadas no backend — só a exibição no template.
        timezone: America/Sao_Paulo

    globals:
        # ... teus globals existentes ...
        analytics_enabled:      '%env(bool:ANALYTICS_ENABLED)%'
        analytics_provider:     '%env(ANALYTICS_PROVIDER)%'
        analytics_id:           '%env(ANALYTICS_ID)%'
        analytics_host:         '%env(ANALYTICS_HOST)%'
        analytics_sample_rate:  '%env(int:ANALYTICS_SAMPLE_RATE)%'
        analytics_track_admin:  '%env(bool:ANALYTICS_TRACK_ADMIN)%'
        analytics_consent_mode: '%env(ANALYTICS_CONSENT_MODE)%'

when@test:
    twig:
        strict_variables: true
