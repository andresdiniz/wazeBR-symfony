# Configuração de Headers de Segurança HTTP
# Implementa as melhores práticas de segurança web

services:
    App\Middleware\SecurityHeadersMiddleware:
        arguments:
            $environment: '%kernel.environment%'
        tags:
            - { name: 'kernel.event_listener', event: 'kernel.response', method: 'onKernelResponse', priority: -256 }

# Framework configuration
framework:
    session:
        cookie_secure: true
        cookie_httponly: true
        cookie_samesite: 'lax'
        gc_maxlifetime: 604800 # 7 days
