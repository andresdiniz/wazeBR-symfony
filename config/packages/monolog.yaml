monolog:
    channels:
        - deprecation
        - scheduler
        - mailer
    handlers:
        # Canal dedicado de e-mail — sempre grava em var/log/mailer.log
        mailer:
            type: stream
            path: '%kernel.logs_dir%/mailer.log'
            level: debug
            channels: ['mailer']

        # Canal dedicado ao scheduler
        scheduler:
            type: rotating_file
            path: '%kernel.logs_dir%/scheduler.log'
            level: info
            channels: ['scheduler']
            max_files: 30

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: '%kernel.logs_dir%/%kernel.environment%.log'
                level: debug
                channels: ['!event']
            scheduler:
                type: stream
                path: '%kernel.logs_dir%/scheduler_dev.log'
                level: debug
                channels: ['scheduler']
            console:
                type: console
                process_psr_3_messages: false
                channels: ['!event', '!doctrine', '!console']

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                buffer_size: 50
                channels: ['!deprecation', '!scheduler', '!mailer']

            nested:
                type: stream
                path: php://stderr
                level: error
                formatter: monolog.formatter.json

            scheduler:
                type: rotating_file
                path: '%kernel.logs_dir%/scheduler.log'
                level: info
                max_files: 14
                channels: ['scheduler']
                formatter: monolog.formatter.json

            mailer:
                type: rotating_file
                path: '%kernel.logs_dir%/mailer.log'
                level: debug
                max_files: 30
                channels: ['mailer']

            deprecation:
                type: rotating_file
                path: '%kernel.logs_dir%/deprecations.log'
                level: notice
                max_files: 7
                channels: [deprecation]
                formatter: monolog.formatter.json
