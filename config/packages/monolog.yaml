monolog:
    channels:
        - deprecation
        - scheduler
        - mailer
    handlers:
        # Canal dedicado de e-mail — sempre grava em var/log/mailer.log,
        # em QUALQUER ambiente. Isso existe porque em prod o handler
        # "main" usa fingers_crossed (só grava se rolar um erro na
        # mesma requisição — um envio de e-mail bem-sucedido, que só
        # loga "info", era descartado em silêncio) e os erros iam pra
        # php://stderr, que em hospedagem compartilhada cai no
        # error_log do painel, não em var/log/. Esse canal separado
        # ignora as duas coisas.
        mailer:
            type: stream
            path: '%kernel.logs_dir%/mailer.log'
            level: debug
            channels: ['mailer']

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: '%kernel.logs_dir%/%kernel.environment%.log'
                level: debug
                channels: ['!event']
            scheduler:
                type: stream
                path: '%kernel.logs_dir%/scheduler_dev.log'
                level: '%env(default:debug:SCHEDULER_LOG_LEVEL)%'
                channels: ['scheduler']
            console:
                type: console
                process_psr_3_messages: false
                channels: ['!event', '!doctrine', '!console']

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                buffer_size: 50
                channels: ['!deprecation', '!scheduler', '!mailer']

            nested:
                type: stream
                path: php://stderr
                level: error
                formatter: monolog.formatter.json

            scheduler_errors:
                type: rotating_file
                path: '%kernel.logs_dir%/scheduler_error.log'
                level: '%env(default:error:SCHEDULER_LOG_LEVEL)%'
                max_files: 14
                channels: ['scheduler']
                formatter: monolog.formatter.json

            console:
                type: console
                process_psr_3_messages: false
                channels: ['!event', '!doctrine', '!console', '!deprecation']

            deprecation:
                type: rotating_file
                path: '%kernel.logs_dir%/deprecations.log'
                level: notice
                max_files: 7
                channels: [deprecation]
                formatter: monolog.formatter.json

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                channels: ['!deprecation', '!scheduler', '!mailer']

            nested:
                type: stream
                path: '%kernel.logs_dir%/test.log'
                level: debug

            scheduler:
                type: stream
                path: '%kernel.logs_dir%/scheduler_test.log'
                level: '%env(default:debug:SCHEDULER_LOG_LEVEL)%'
                channels: ['scheduler']

            deprecation:
                type: stream
                path: '%kernel.logs_dir%/deprecations_test.log'
                channels: [deprecation]
                level: notice
