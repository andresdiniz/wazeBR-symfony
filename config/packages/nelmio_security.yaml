nelmio_security:
    clickjacking:
        paths:
            '^/.*': DENY

    content_type:
        nosniff: true

    referrer_policy:
        enabled: true
        policies:
            - strict-origin-when-cross-origin

    csp:
        enabled: true
        enforce:
            default-src:
                - 'self'

            script-src:
                - 'self'
                - 'https://cdn.jsdelivr.net'
                - 'https://cdnjs.cloudflare.com'
                - 'https://unpkg.com'
                - 'https://static.cloudflareinsights.com'
                - 'https://use.typekit.net'
                - "'sha256-NgIIXtUYqeFz8pc52tSmIvzI4lOTDAMun9JVGSfR0os='"
                - "'sha256-4bDPEWygbscdkeVePkBeoi2TQWL4D5w9UBpd+kjVCX4='"
                - "'sha256-AwcfFH8/qhnh/6Q2qeJgcvXDZDsX6rbPYO/A+IaXcno='"
                - "'sha256-6PeNBy+owUm6Gd8Z5yEum0eIWDj1/qFaCZ3n8xIKraY='"

            style-src:
                - 'self'
                - 'unsafe-inline' # Libera tags <style> e atributos style="" sem conflito com hashes
                - 'https://cdn.jsdelivr.net'
                - 'https://cdnjs.cloudflare.com'
                - 'https://fonts.googleapis.com'
                - 'https://unpkg.com'
                - 'https://use.typekit.net'
                # (Hashes de estilo removidos para permitir que o unsafe-inline funcione livremente)

            img-src:
                - 'self'
                - 'data:'
                - 'blob:'
                - 'https://*.tile.openstreetmap.org'
                - 'https://cdnjs.cloudflare.com'
                - 'https://unpkg.com'

            font-src:
                - 'self'
                - 'data:'
                - 'https://fonts.gstatic.com'
                - 'https://fonts.googleapis.com'
                - 'https://use.typekit.net'

            connect-src:
                - 'self'
                - 'https://api.waze.com'
                - 'https://cloudflareinsights.com'
                - 'https://static.cloudflareinsights.com'
                - 'https://unpkg.com'
                - 'https://cdnjs.cloudflare.com'
                - 'https://*.camtraffic.com'
                - 'https://*.cetransito.com.br'
                - 'https://*.detran.mg.gov.br'
                - 'https://*.transparencia.mg.gov.br'

            object-src:
                - 'none'

            base-uri:
                - 'self'

            form-action:
                - 'self'

when@dev:
    nelmio_security:
        csp:
            enabled: false
