nelmio_security:
    clickjacking:
        paths:
            '^/.*': DENY

    content_type:
        nosniff: true

    referrer_policy:
        enabled: true
        policies:
            - strict-origin-when-cross-origin

    csp:
        enabled: true
        enforce:
            default-src:
                - 'self'
            script-src:
                - 'self'
                - 'strict-dynamic'
                - 'https://cdn.jsdelivr.net'
                - 'https://cdnjs.cloudflare.com'
                - 'https://unpkg.com'
                - 'https://static.cloudflareinsights.com'
                - 'https://use.typekit.net'
            style-src:
                - 'self'
                - 'https://cdn.jsdelivr.net'
                - 'https://cdnjs.cloudflare.com'
                - 'https://fonts.googleapis.com'
                - 'https://unpkg.com'
                - 'https://use.typekit.net'
            img-src:
                - 'self'
                - 'data:'
                - 'blob:'
                - 'https://*.tile.openstreetmap.org'
                - 'https://cdnjs.cloudflare.com'
                - 'https://unpkg.com'
            font-src:
                - 'self'
                - 'data:'
                - 'https://fonts.gstatic.com'
                - 'https://fonts.googleapis.com'
                - 'https://use.typekit.net'
            connect-src:
                - 'self'
                - 'https://api.waze.com'
                - 'https://cloudflareinsights.com'
                - 'https://static.cloudflareinsights.com'
                - 'https://unpkg.com'
                - 'https://cdnjs.cloudflare.com'
                - 'https://*.camtraffic.com'
                - 'https://*.cetransito.com.br'
                - 'https://*.detran.mg.gov.br'
                - 'https://*.transparencia.mg.gov.br'

when@dev:
    nelmio_security:
        csp:
            enabled: false
