nelmio_security:
    clickjacking:
        paths:
            '^/.*': DENY
    xss_protection:
        enabled: false # A própria CSP substitui esta proteção nos navegadores modernos
    content_type:
        nosniff: true
    referrer_policy:
        enabled: true
        policies:
            - strict-origin-when-cross-origin
    csp:
        enabled: true
        enforce:
            default-src: ['self']
            script-src: 
                - 'self'
                - 'unsafe-inline' # Necessário se usar Rocket Loader ou scripts inline da aplicação
                - 'https://cdn.jsdelivr.net'
                - 'https://cdnjs.cloudflare.com'
                - 'https://unpkg.com'
                - 'https://static.cloudflareinsights.com'
            style-src: 
                - 'self'
                - 'unsafe-inline' # Recomendado para Leaflet e estilizações dinâmicas em DOM
                - 'https://cdn.jsdelivr.net'
                - 'https://cdnjs.cloudflare.com'
                - 'https://fonts.googleapis.com'
                - 'https://unpkg.com'
            img-src: 
                - 'self'
                - 'data:'
                - 'blob:'
                - 'https://*.tile.openstreetmap.org'
                - 'https://cdnjs.cloudflare.com'
                - 'https://unpkg.com'
            font-src: 
                - 'self'
                - 'data:'
                - 'https://fonts.gstatic.com'
                - 'https://fonts.googleapis.com'
            connect-src: 
                - 'self'
                - 'https://api.waze.com'
                - 'https://cloudflareinsights.com'
                - 'https://static.cloudflareinsights.com'

when@dev:
    nelmio_security:
        csp:
            enabled: false