security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # Feed JSON público — stateless, sem sessão, sem redirecionamento para login.
        # O padrão casa APENAS com /partner-feed/{qualquer-coisa}.json
        partner_feed_json:
            pattern: ^/partner-feed/[^/]+\.json$
            security: false

        main:
            lazy: true
            provider: app_user_provider

            form_login:
                login_path: auth_login
                check_path: auth_login
                enable_csrf: true
                default_target_path: app_post_login_redirect
                # Se o usuário tentar acessar uma URL protegida antes do login,
                # o Symfony volta pra ela depois. Bom manter:
                use_referer: true

            logout:
                path: app_logout
                target: auth_login      # volta pro login, não pra "/"

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800        # 1 semana em segundos
                path: /

    # Somente a PRIMEIRA regra que casar é aplicada
    access_control:
        - { path: ^/login,          roles: PUBLIC_ACCESS }
        - { path: ^/register,       roles: PUBLIC_ACCESS }
        - { path: ^/reset-password, roles: PUBLIC_ACCESS }
        - { path: ^/post-login-redirect, roles: IS_AUTHENTICATED_FULLY }

        - { path: ^/account-admin,  roles: ROLE_ACCOUNT_ADMIN }
        - { path: ^/partner,        roles: ROLE_PARTNER_ADMIN }
        - { path: ^/field-agent,    roles: ROLE_FIELD_AGENT }
        - { path: ^/dashboard,      roles: IS_AUTHENTICATED_FULLY }

        - { path: ^/,               roles: PUBLIC_ACCESS }

    # Herança: quem tem a role da esquerda também "tem" as da direita
    role_hierarchy:
        ROLE_SUPER_ADMIN:
            - ROLE_ADMIN
            - ROLE_ACCOUNT_ADMIN
            - ROLE_PARTNER_ADMIN
            - ROLE_FIELD_AGENT
            - ROLE_OPERATOR
            - ROLE_VIEWER

        ROLE_ADMIN:
            - ROLE_ACCOUNT_ADMIN
            - ROLE_PARTNER_ADMIN
            - ROLE_FIELD_AGENT
            - ROLE_OPERATOR
            - ROLE_VIEWER

        ROLE_ACCOUNT_ADMIN:
            - ROLE_OPERATOR
            - ROLE_VIEWER

        ROLE_PARTNER_ADMIN:
            - ROLE_OPERATOR
            - ROLE_VIEWER

        ROLE_OPERATOR:
            - ROLE_VIEWER

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
