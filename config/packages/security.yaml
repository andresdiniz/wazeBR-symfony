security:
    access_denied_url: /access-denied

    role_hierarchy:
        ROLE_USER: [ROLE_CEMADEN]
        ROLE_OPERATOR: [ROLE_USER]
        ROLE_ACCOUNT_ADMIN: [ROLE_USER]
        ROLE_ADMIN: [ROLE_USER, ROLE_ACCOUNT_ADMIN, ROLE_CEMADEN]
        ROLE_SUPER_ADMIN: [ROLE_ADMIN, ROLE_ACCOUNT_ADMIN, ROLE_CEMADEN]

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider
            login_throttling:
                max_attempts: 5
                interval: '1 minute'
            form_login:
                login_path: auth_login
                check_path: auth_login
                default_target_path: dashboard_index
                enable_csrf: true
                csrf_parameter: _csrf_token
                username_parameter: email
                password_parameter: password
            logout:
                path: auth_logout
                target: auth_login
            remember_me:
                secret: '%env(APP_SECRET)%'
                lifetime: 604800
                path: /
                secure: true
                httponly: true
                samesite: lax
                always_remember_me: true
                signature_properties: [password]
            user_checker: App\Security\UserChecker

    access_control:
        - { path: '^/$', roles: PUBLIC_ACCESS }
        - { path: '^/login', roles: PUBLIC_ACCESS }
        - { path: '^/register', roles: PUBLIC_ACCESS }
        - { path: '^/(esqueci-senha|redefinir-senha)', roles: PUBLIC_ACCESS }
        - { path: '^/health', roles: PUBLIC_ACCESS }
        - { path: '^/cron', roles: PUBLIC_ACCESS }
        - { path: '^/api', roles: PUBLIC_ACCESS }
        - { path: '^/admin', roles: ROLE_ADMIN }
        - { path: '^/dashboard', roles: ROLE_USER }
        - { path: '^/account', roles: ROLE_USER }
        - { path: '^/alerts', roles: ROLE_USER }
        - { path: '^/routes', roles: ROLE_USER }
        - { path: '^/traffic', roles: ROLE_USER }
        - { path: '^/notifications', roles: ROLE_USER }
        - { path: '^/operator', roles: ROLE_OPERATOR }
        - { path: '^/cemaden', roles: ROLE_USER }
        - { path: '^/cifs', roles: ROLE_USER }
        - { path: '^/hydro', roles: ROLE_USER }
        - { path: '^/', roles: ROLE_USER }
