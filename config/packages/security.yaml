security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        partner_feed_json:
            pattern: ^/partner-feed/[^/]+\.json$
            security: false

        main:
            lazy: true
            provider: app_user_provider

            form_login:
                login_path: auth_login
                check_path: auth_login
                enable_csrf: true
                default_target_path: app_post_login_redirect
                use_referer: true

            logout:
                path: app_logout
                target: auth_login
                invalidate_session: true
                delete_cookies: true

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /
                always_remember_me: false

    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }
        - { path: ^/reset-password, roles: PUBLIC_ACCESS }
        - { path: ^/post-login-redirect, roles: IS_AUTHENTICATED_FULLY }

        - { path: ^/account-admin, roles: ROLE_ACCOUNT_ADMIN }
        - { path: ^/partner, roles: ROLE_PARTNER_ADMIN }
        - { path: ^/field-agent, roles: ROLE_FIELD_AGENT }
        - { path: ^/dashboard, roles: IS_AUTHENTICATED_FULLY }

        - { path: ^/, roles: PUBLIC_ACCESS }

    role_hierarchy:
        ROLE_SUPER_ADMIN:
            - ROLE_ADMIN
            - ROLE_ACCOUNT_ADMIN
            - ROLE_PARTNER_ADMIN
            - ROLE_FIELD_AGENT
            - ROLE_OPERATOR
            - ROLE_VIEWER

        ROLE_ADMIN:
            - ROLE_ACCOUNT_ADMIN
            - ROLE_PARTNER_ADMIN
            - ROLE_FIELD_AGENT
            - ROLE_OPERATOR
            - ROLE_VIEWER

        ROLE_ACCOUNT_ADMIN:
            - ROLE_OPERATOR
            - ROLE_VIEWER

        ROLE_PARTNER_ADMIN:
            - ROLE_OPERATOR
            - ROLE_VIEWER

        ROLE_OPERATOR:
            - ROLE_VIEWER

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
