security:
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            login_throttling:
                max_attempts: 5
                interval: 1 minute
            form_login:
                authenticator: App\Security\LoginFormAuthenticator
                login_path: auth_login
                check_path: auth_login
                default_target_path: dashboard_index
                enable_csrf: true
                csrf_parameter: _csrf_token
            logout:
                path: auth_logout
                target: auth_login
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /
                always_remember_me: true
                secure: true
                samesite: lax
            user_checker: security.user_checker

    access_control:
        - { path: ^/$, roles: PUBLIC_ACCESS }
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/register, roles: PUBLIC_ACCESS }
        - { path: ^/reset-password, roles: PUBLIC_ACCESS }
        - { path: ^/health, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/dashboard, roles: ROLE_USER }
        - { path: ^/account, roles: ROLE_USER }
        - { path: ^/alerts, roles: ROLE_USER }
        - { path: ^/routes, roles: ROLE_USER }
        - { path: ^/traffic, roles: ROLE_USER }
        - { path: ^/notifications, roles: ROLE_USER }
        - { path: ^/operator, roles: ROLE_OPERATOR }
        - { path: ^/cemaden, roles: ROLE_CEMADEN }
        - { path: ^/cifs, roles: ROLE_CEMADEN }
        - { path: ^/hydro, roles: ROLE_CEMADEN }
        - { path: ^/, roles: ROLE_USER }

when@prod:
    security:
        firewalls:
            main:
                form_login:
                    require_previous_session: false
                remember_me:
                    secure: true
                    httponly: true
                    samesite: lax
